# 開発用のDB。アプリ本体はDockerを使わず、手元のNode.jsで動かす
#   起動：pnpm db:up   停止：pnpm db:down
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shinriisen
      POSTGRES_PASSWORD: shinriisen
      POSTGRES_DB: shinriisen
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinriisen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
