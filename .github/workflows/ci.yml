name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # ストアの PostgreSQL 版のテスト用
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: gishin_ankin
          POSTGRES_PASSWORD: gishin_ankin
          POSTGRES_DB: gishin_ankin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gishin_ankin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gishin_ankin:gishin_ankin@localhost:5432/gishin_ankin

    steps:
      - uses: actions/checkout@v4

      # package.json の packageManager に書いた pnpm のバージョンを使う
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm-lock.yaml と package.json がずれていたら失敗させる
      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test
